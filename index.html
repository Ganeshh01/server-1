<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Formula Racing | Totally Animated</title>
  <style>
    /* Global Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #0b0e14;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Arial Black', 'Impact', 'Franklin Gothic Bold', sans-serif;
      overflow: hidden;
    }

    /* MAIN RACING CANVAS — fully animated scene */
    .race-scene {
      position: relative;
      width: 1200px;
      height: 600px;
      background: linear-gradient(180deg, #0b1a2a 0%, #1b3b4f 30%, #2d5f7a 70%, #0e2c3a 100%);
      border-radius: 32px;
      box-shadow: 0 30px 40px rgba(0, 0, 0, 0.8), inset 0 0 60px rgba(255, 200, 0, 0.2);
      overflow: hidden;
      border: 4px solid #f1c40f;
      transform: scale(1);
      animation: scenePulse 4s infinite alternate ease-in-out;
    }

    @keyframes scenePulse {
      0% { box-shadow: 0 30px 40px rgba(0,0,0,0.8), inset 0 0 60px rgba(255, 200, 0, 0.15); border-color: #f1c40f; }
      100% { box-shadow: 0 30px 50px rgba(255, 215, 0, 0.5), inset 0 0 80px rgba(255, 215, 0, 0.4); border-color: #ffd966; }
    }

    /* TRACK — animated asphalt with moving lines */
    .track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 220px;
      background: #1e1e1e;
      background-image: 
        repeating-linear-gradient(90deg, 
          #2a2a2a 0px, #2a2a2a 40px, 
          #333 40px, #333 80px);
      border-top: 6px solid #f1c40f;
      border-bottom: 6px solid #f1c40f;
      z-index: 5;
      overflow: hidden;
      animation: trackGlow 3s infinite alternate;
    }

    @keyframes trackGlow {
      0% { box-shadow: inset 0 0 30px rgba(255, 215, 0, 0.2); }
      100% { box-shadow: inset 0 0 60px rgba(255, 215, 0, 0.6); }
    }

    /* moving track lines */
    .track-lines {
      position: absolute;
      top: 50%;
      left: 0;
      width: 200%;
      height: 12px;
      background: repeating-linear-gradient(90deg, 
        #f1c40f 0px, #f1c40f 60px, 
        transparent 60px, transparent 120px);
      transform: translateY(-50%);
      animation: moveLines 1.2s linear infinite;
      filter: drop-shadow(0 0 6px #ffd700);
    }

    @keyframes moveLines {
      0% { transform: translateX(0) translateY(-50%); }
      100% { transform: translateX(-120px) translateY(-50%); }
    }

    /* glowing edge */
    .track-glow {
      position: absolute;
      bottom: 210px;
      left: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, transparent, #f1c40f, #ffaa00, #f1c40f, transparent);
      filter: blur(6px);
      animation: glowMove 2s infinite alternate;
    }

    @keyframes glowMove {
      0% { opacity: 0.6; filter: blur(4px); }
      100% { opacity: 1; filter: blur(10px); }
    }

    /* CARS — three animated F1 racers */
    .car {
      position: absolute;
      bottom: 150px;
      width: 140px;
      height: 50px;
      z-index: 10;
      filter: drop-shadow(0 12px 10px rgba(0,0,0,0.6));
      animation: carBounce 0.18s infinite alternate ease-in-out;
      transition: all 0.1s;
    }

    /* Car body */
    .car-body {
      position: absolute;
      width: 100%;
      height: 34px;
      background: linear-gradient(180deg, #e63946, #b71c1c);
      border-radius: 18px 18px 8px 8px;
      border: 2px solid #ffb703;
      box-shadow: inset 0 -6px 0 #8b0000, inset 0 6px 10px #ff8a8a;
      overflow: hidden;
    }

    .car-body::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 12px;
      width: 40px;
      height: 10px;
      background: #fff9c4;
      border-radius: 10px;
      box-shadow: 0 0 12px #fff9c4;
      animation: headlight 1.5s infinite alternate;
    }

    @keyframes headlight {
      0% { opacity: 0.5; box-shadow: 0 0 6px #fff9c4; }
      100% { opacity: 1; box-shadow: 0 0 20px #fff9c4, 0 0 30px #ffd966; }
    }

    /* cockpit */
    .car-cockpit {
      position: absolute;
      top: -6px;
      left: 40px;
      width: 45px;
      height: 20px;
      background: #2c3e50;
      border-radius: 12px 12px 0 0;
      border: 2px solid #f1c40f;
      border-bottom: none;
      box-shadow: 0 -4px 0 #1a1a1a;
    }

    /* rear wing */
    .car-wing {
      position: absolute;
      right: -10px;
      bottom: 14px;
      width: 26px;
      height: 14px;
      background: #f1c40f;
      border-radius: 4px 8px 8px 4px;
      transform: skewX(-10deg);
      border: 2px solid #b8860b;
      box-shadow: 0 4px 0 #b8860b;
    }

    /* front wing */
    .car-frontwing {
      position: absolute;
      left: -18px;
      bottom: 10px;
      width: 30px;
      height: 12px;
      background: #f1c40f;
      border-radius: 8px 2px 2px 8px;
      transform: skewX(10deg);
      border: 2px solid #b8860b;
      box-shadow: 0 4px 0 #b8860b;
    }

    /* wheels */
    .wheel {
      position: absolute;
      bottom: -6px;
      width: 26px;
      height: 26px;
      background: radial-gradient(circle, #333 30%, #111 80%);
      border-radius: 50%;
      border: 3px solid #555;
      box-shadow: 0 0 0 2px #000, 0 8px 8px rgba(0,0,0,0.5);
      animation: wheelSpin 0.2s infinite linear;
    }

    .wheel.left {
      left: 10px;
    }

    .wheel.right {
      right: 10px;
    }

    @keyframes wheelSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes carBounce {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-3px); }
    }

    /* Individual car colors & positions */
    .car1 {
      left: 5%;
      animation: carMove1 3s infinite alternate ease-in-out, carBounce 0.15s infinite alternate;
    }

    .car1 .car-body {
      background: linear-gradient(180deg, #e63946, #a4161a);
    }

    .car2 {
      left: 30%;
      bottom: 140px;
      animation: carMove2 3.5s infinite alternate ease-in-out, carBounce 0.2s infinite alternate;
      z-index: 11;
    }

    .car2 .car-body {
      background: linear-gradient(180deg, #1e6091, #0a2f44);
    }

    .car2 .car-body::before {
      background: #b3e5fc;
      box-shadow: 0 0 12px #b3e5fc;
    }

    .car2 .car-wing, .car2 .car-frontwing {
      background: #f1c40f;
    }

    .car3 {
      left: 60%;
      bottom: 160px;
      animation: carMove3 4s infinite alternate ease-in-out, carBounce 0.18s infinite alternate;
      z-index: 9;
    }

    .car3 .car-body {
      background: linear-gradient(180deg, #2a9d8f, #1b5e4a);
    }

    .car3 .car-body::before {
      background: #a7ffeb;
      box-shadow: 0 0 12px #a7ffeb;
    }

    @keyframes carMove1 {
      0% { left: 2%; }
      100% { left: 18%; }
    }

    @keyframes carMove2 {
      0% { left: 28%; }
      100% { left: 50%; }
    }

    @keyframes carMove3 {
      0% { left: 55%; }
      100% { left: 80%; }
    }

    /* SMOKE / EXHAUST */
    .smoke {
      position: absolute;
      bottom: 20px;
      left: -20px;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #aaa, transparent);
      border-radius: 50%;
      opacity: 0.7;
      animation: smokePuff 0.8s infinite;
    }

    .smoke2 {
      left: -35px;
      bottom: 10px;
      width: 28px;
      height: 28px;
      animation-delay: 0.2s;
    }

    .smoke3 {
      left: -50px;
      bottom: 25px;
      width: 16px;
      height: 16px;
      animation-delay: 0.4s;
    }

    @keyframes smokePuff {
      0% { transform: scale(0.6) translateX(0); opacity: 0.8; }
      100% { transform: scale(2.2) translateX(-30px); opacity: 0; }
    }

    /* GRANDSTAND / CROWD (animated) */
    .grandstand {
      position: absolute;
      top: 30px;
      left: 0;
      width: 100%;
      height: 100px;
      background: repeating-linear-gradient(90deg, 
        #2d2d2d 0px, #2d2d2d 15px, 
        #3a3a3a 15px, #3a3a3a 30px);
      border-bottom: 4px solid #f1c40f;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 0 20px;
      z-index: 3;
      overflow: hidden;
    }

    .crowd {
      display: flex;
      gap: 12px;
      margin-bottom: 6px;
    }

    .person {
      width: 14px;
      height: 28px;
      background: #e67e22;
      border-radius: 8px 8px 0 0;
      position: relative;
      animation: crowdWave 2s infinite alternate;
      transform-origin: bottom;
    }

    .person::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 1px;
      width: 12px;
      height: 12px;
      background: #f1c40f;
      border-radius: 50%;
    }

    .person:nth-child(odd) {
      background: #3498db;
      animation-delay: 0.1s;
    }

    .person:nth-child(3n) {
      background: #e74c3c;
      animation-delay: 0.3s;
    }

    .person:nth-child(5n) {
      background: #2ecc71;
      animation-delay: 0.5s;
    }

    @keyframes crowdWave {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(1.2); }
    }

    /* Animated flags */
    .flag {
      position: absolute;
      top: 10px;
      right: 80px;
      font-size: 2.5rem;
      animation: flagWave 0.6s infinite alternate;
      filter: drop-shadow(0 0 8px gold);
      z-index: 15;
    }

    @keyframes flagWave {
      0% { transform: rotate(-5deg) scale(1); }
      100% { transform: rotate(5deg) scale(1.1); }
    }

    /* Floating particles (sparks / energy) */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ffd966;
      border-radius: 50%;
      box-shadow: 0 0 12px #ffd700;
      animation: floatParticle 3s infinite linear;
      z-index: 20;
    }

    @keyframes floatParticle {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-200px) scale(0); opacity: 0; }
    }

    /* F1 TEXT / LOGO animated */
    .f1-logo {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3.5rem;
      font-weight: 900;
      color: #f1c40f;
      text-shadow: 0 0 20px #ffaa00, 0 0 40px #ff8c00, 4px 4px 0 #b8860b;
      letter-spacing: 8px;
      z-index: 25;
      animation: logoPulse 1.5s infinite alternate, logoGlow 2s infinite alternate;
      font-family: 'Arial Black', sans-serif;
      pointer-events: none;
    }

    .f1-logo span {
      color: #e63946;
      text-shadow: 0 0 20px #ff4d4d, 4px 4px 0 #8b0000;
    }

    @keyframes logoPulse {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.05); }
    }

    @keyframes logoGlow {
      0% { filter: drop-shadow(0 0 10px gold); }
      100% { filter: drop-shadow(0 0 30px #ffaa00); }
    }

    /* speedometer / gauge */
    .gauge {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 6px solid #333;
      background: #111;
      box-shadow: 0 0 20px #f1c40f, inset 0 0 10px #000;
      z-index: 30;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f1c40f;
      font-size: 1.2rem;
      font-weight: bold;
      animation: gaugeSpin 2s infinite alternate;
    }

    @keyframes gaugeSpin {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    .gauge::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 30px;
      background: #e63946;
      bottom: 50%;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      transform-origin: bottom center;
      border-radius: 3px;
      animation: needleMove 1s infinite alternate;
    }

    @keyframes needleMove {
      0% { transform: translateX(-50%) rotate(30deg); }
      100% { transform: translateX(-50%) rotate(80deg); }
    }

    /* Start lights */
    .start-lights {
      position: absolute;
      top: 130px;
      left: 40px;
      display: flex;
      gap: 12px;
      z-index: 35;
    }

    .light {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #2c2c2c;
      border: 3px solid #111;
      box-shadow: inset 0 0 10px #000;
      animation: lightBlink 0.8s infinite alternate;
    }

    .light.red {
      background: #e63946;
      box-shadow: 0 0 20px #e63946, inset 0 0 10px #ff8a8a;
      animation-delay: 0s;
    }

    .light.green {
      background: #2ecc71;
      box-shadow: 0 0 20px #2ecc71, inset 0 0 10px #aaffaa;
      animation-delay: 0.3s;
    }

    .light.yellow {
      background: #f1c40f;
      box-shadow: 0 0 20px #f1c40f, inset 0 0 10px #fff9c4;
      animation-delay: 0.6s;
    }

    @keyframes lightBlink {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    /* PIT / background motion blur */
    .motion-blur {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(255,215,0,0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
      animation: blurPulse 3s infinite alternate;
    }

    @keyframes blurPulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.8; }
    }

    /* additional cars in background */
    .bg-car {
      position: absolute;
      width: 70px;
      height: 22px;
      background: #555;
      border-radius: 12px 12px 4px 4px;
      opacity: 0.5;
      z-index: 2;
      animation: bgCarMove 8s infinite linear;
    }

    @keyframes bgCarMove {
      0% { left: -100px; }
      100% { left: 1300px; }
    }

  </style>
</head>
<body>
  <div class="race-scene">

    <!-- moving background blur -->
    <div class="motion-blur"></div>

    <!-- floating particles (sparks) -->
    <div class="particle" style="left: 10%; bottom: 200px; animation-duration: 2.5s;"></div>
    <div class="particle" style="left: 25%; bottom: 180px; animation-duration: 3.2s; animation-delay: 0.5s;"></div>
    <div class="particle" style="left: 45%; bottom: 220px; animation-duration: 2.8s; animation-delay: 1s;"></div>
    <div class="particle" style="left: 70%; bottom: 190px; animation-duration: 3.5s; animation-delay: 0.2s;"></div>
    <div class="particle" style="left: 85%; bottom: 210px; animation-duration: 2.2s; animation-delay: 0.8s;"></div>

    <!-- F1 Logo animated -->
    <div class="f1-logo">F<span>1</span></div>

    <!-- GRANDSTAND WITH ANIMATED CROWD -->
    <div class="grandstand">
      <div class="crowd">
        <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
        <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
      </div>
      <div class="crowd">
        <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
        <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
      </div>
      <div class="crowd">
        <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
        <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
      </div>
    </div>

    <!-- Start lights animation -->
    <div class="start-lights">
      <div class="light red"></div>
      <div class="light yellow"></div>
      <div class="light green"></div>
    </div>

    <!-- animated flag -->
    <div class="flag">🏁</div>

    <!-- TRACK WITH MOVING LINES -->
    <div class="track">
      <div class="track-lines"></div>
    </div>
    <div class="track-glow"></div>

    <!-- CAR 1 (Red) -->
    <div class="car car1">
      <div class="car-body">
        <div class="car-cockpit"></div>
        <div class="smoke"></div>
        <div class="smoke smoke2"></div>
        <div class="smoke smoke3"></div>
      </div>
      <div class="car-wing"></div>
      <div class="car-frontwing"></div>
      <div class="wheel left"></div>
      <div class="wheel right"></div>
    </div>

    <!-- CAR 2 (Blue) -->
    <div class="car car2">
      <div class="car-body">
        <div class="car-cockpit"></div>
        <div class="smoke"></div>
        <div class="smoke smoke2"></div>
        <div class="smoke smoke3"></div>
      </div>
      <div class="car-wing"></div>
      <div class="car-frontwing"></div>
      <div class="wheel left"></div>
      <div class="wheel right"></div>
    </div>

    <!-- CAR 3 (Teal) -->
    <div class="car car3">
      <div class="car-body">
        <div class="car-cockpit"></div>
        <div class="smoke"></div>
        <div class="smoke smoke2"></div>
        <div class="smoke smoke3"></div>
      </div>
      <div class="car-wing"></div>
      <div class="car-frontwing"></div>
      <div class="wheel left"></div>
      <div class="wheel right"></div>
    </div>

    <!-- Background cars for depth -->
    <div class="bg-car" style="bottom: 250px; animation-duration: 12s; animation-delay: 0s;"></div>
    <div class="bg-car" style="bottom: 280px; animation-duration: 15s; animation-delay: 2s; width: 90px; height: 28px;"></div>

    <!-- Speed gauge -->
    <div class="gauge">300</div>

  </div>
</body>
</html>
